<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-label="Consolidado de los cuatro módulos del periodo I"><title>Periodo I · Secuencia de fundamentos técnicos</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs><rect width="1080" height="610" fill="#fff"/><g fill="#151515" font-family="Arial,Helvetica,sans-serif"><text x="50" y="53" font-size="29" font-weight="700">Periodo I · Fundamentos técnicos</text><text x="50" y="86" font-size="17">Una necesidad se convierte en una solución verificable mediante cuatro módulos consecutivos.</text></g><line x1="50" y1="108" x2="1030" y2="108" stroke="#ccc"/><g><rect x="56" y="162" width="225" height="222" rx="10" stroke="#222" stroke-width="2" fill="#f8f8f8"/><text x="78" y="207" fill="#222" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">01</text><text x="78" y="252" fill="#222" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">IDENTIFICAR</text><text x="78" y="295" fill="#444" font-family="Arial,Helvetica,sans-serif" font-size="13.5">Usuario · necesidad · requisitos</text><line x1="78" y1="319" x2="257" y2="319" stroke="#ccc"/><text x="78" y="349" fill="#222" font-family="Arial,Helvetica,sans-serif" font-size="13.5">Ficha del problema</text></g><line x1="283" y1="269" x2="310" y2="269" stroke="#111" stroke-width="2" marker-end="url(#a)"/><g><rect x="313" y="162" width="225" height="222" rx="10" stroke="#222" stroke-width="2" fill="#f8f8f8"/><text x="335" y="207" fill="#222" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">02</text><text x="335" y="252" fill="#222" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">REPRESENTAR</text><text x="335" y="295" fill="#444" font-family="Arial,Helvetica,sans-serif" font-size="13.5">Geometría 3D · vistas · cotas</text><line x1="335" y1="319" x2="514" y2="319" stroke="#ccc"/><text x="335" y="349" fill="#222" font-family="Arial,Helvetica,sans-serif" font-size="13.5">Modelo editable y acotado</text></g><line x1="540" y1="269" x2="567" y2="269" stroke="#111" stroke-width="2" marker-end="url(#a)"/><g><rect x="570" y="162" width="225" height="222" rx="10" stroke="#222" stroke-width="2" fill="#f8f8f8"/><text x="592" y="207" fill="#222" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">03</text><text x="592" y="252" fill="#222" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">DOCUMENTAR</text><text x="592" y="295" fill="#444" font-family="Arial,Helvetica,sans-serif" font-size="13.5">Archivos · versiones · cambios</text><line x1="592" y1="319" x2="771" y2="319" stroke="#ccc"/><text x="592" y="349" fill="#222" font-family="Arial,Helvetica,sans-serif" font-size="13.5">Ficha técnica e historial</text></g><line x1="797" y1="269" x2="824" y2="269" stroke="#111" stroke-width="2" marker-end="url(#a)"/><g><rect x="827" y="162" width="225" height="222" rx="10" stroke="#222" stroke-width="2" fill="#222"/><text x="849" y="207" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">04</text><text x="849" y="252" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">VALIDAR</text><text x="849" y="295" fill="#eee" font-family="Arial,Helvetica,sans-serif" font-size="13.5">Pruebas · matriz · evidencias</text><line x1="849" y1="319" x2="1028" y2="319" stroke="#bbb"/><text x="849" y="349" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="13.5">Brief y entrega final</text></g><g font-family="Arial,Helvetica,sans-serif" fill="#222"><text x="55" y="452" font-size="20" font-weight="700">Resultado integrador</text><text x="55" y="484" font-size="18">Problema + modelo CAD + control de cambios + matriz de validación</text><text x="55" y="521" font-size="16">Transferencia a 11.º: diseñar el propósito, las fuentes, las in