<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Módulo 4 · Validar el proyecto técnico" viewBox="0 0 1040 560"><title>Módulo 4 · Validar el proyecto técnico</title><desc>Una presentación convincente requiere demostrar qué se probó y con qué resultados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}</style></defs><rect width="1040" height="560" fill="white"/><text x="46" y="52" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">Módulo 4 · Validar el proyecto técnico</text><text x="46" y="79" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Una presentación convincente requiere demostrar qué se probó y con qué resultados.</text><line x1="46" y1="96" x2="994" y2="96" stroke="#ccc"/><g><rect x="55" y="144" width="220" height="94" rx="13" fill="#ececec" stroke="#252525" stroke-width="1.8"/><text x="165" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#222">REQUISITO</text><text x="165" y="202" text-anchor="middle" font-size="14" fill="#4b4b4b">Debe poder comprobarse</text></g><line x1="275" y1="192" x2="324" y2="192" stroke="#333" stroke-width="2"  marker-end="url(#arrow)"/><g><rect x="325" y="144" width="220" height="94" rx="13" fill="#fff" stroke="#252525" stroke-width="1.8"/><text x="435" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#222">PROTOTIPO</text><text x="435" y="202" text-anchor="middle" font-size="14" fill="#4b4b4b">Archivo CAD + plano</text></g><line x1="545" y1="192" x2="594" y2="192" stroke="#333" stroke-width="2"  marker-end="url(#arrow)"/><g><rect x="595" y="144" width="220" height="94" rx="13" fill="#fff" stroke="#252525" stroke-width="1.8"/><text x="705" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#222">PRUEBA</text><text x="705" y="202" text-anchor="middle" font-size="14" fill="#4b4b4b">Medición y revisión</text></g><line x1="815" y1="192" x2="846" y2="192" stroke="#333" stroke-width="2"  marker-end="url(#arrow)"/><g><rect x="847" y="144" width="135" height="94" rx="13" fill="#202020" stroke="#252525" stroke-width="1.8"/><text x="914.5" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">RESULTADO</text><text x="914.5" y="202" text-anchor="middle" font-size="14" fill="#e8e8e8">Pasa / falla</text></g><text x="58" y="298" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">Matriz de verificación del proyecto</text><rect x="56" y="319" width="920" height="149" rx="8" fill="#fff" stroke="#aaa"/><path d="M56 356H976M56 393H976M56 431H976M420 319V468M715 319V468" fill="none" stroke="#bbb"/><text x="77" y="344" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">Requisito</text><text x="444" y="344" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">Evidencia</text><text x="739" y="344" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">Estado</text><text x="77" y="381" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Ancho de puerta ≥ 0,80 m</text><text x="444" y="381" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Cota en plano: 0,85 m</text><text x="739" y="381" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">CUMPLE</text><text x="77" y="419" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Acceso sin interferencias</text><text x="444" y="419" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Prueba de recorrido</text><text x="739" y="419" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">REVISAR</text><text x="77" y="457" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Modelo editable entregado</text><text x="444" y="457" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Archivo del proyecto</text><text x="739" y="457" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">CUMPLE</text><text x="58" y="500" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Una falla no se oculta: se registra, se corrige y se vuelve a probar.</text><line x1="46" y1="524" x2="994" y2="524" stroke="#ddd"/><text x="46" y="548" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start">INSTITUTO JORGE ROBLEDO  ·  INFORMÁTICA 10.º  ·  PERIODO I</text></svg>