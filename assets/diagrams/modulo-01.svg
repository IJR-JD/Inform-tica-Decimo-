<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Módulo 1 · Del problema a los requisitos" viewBox="0 0 1040 560"><title>Módulo 1 · Del problema a los requisitos</title><desc>Un proceso de diseño comienza por las necesidades, no por elegir software.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}</style></defs><rect width="1040" height="560" fill="white"/><text x="46" y="52" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">Módulo 1 · Del problema a los requisitos</text><text x="46" y="79" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Un proceso de diseño comienza por las necesidades, no por elegir software.</text><line x1="46" y1="96" x2="994" y2="96" stroke="#ccc"/><g><rect x="55" y="155" width="204" height="89" rx="13" fill="#fff" stroke="#252525" stroke-width="1.8"/><text x="157" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#222">OBSERVAR</text><text x="157" y="213" text-anchor="middle" font-size="14" fill="#4b4b4b">Situación real</text></g><line x1="259" y1="199" x2="293" y2="199" stroke="#333" stroke-width="2"  marker-end="url(#arrow)"/><g><rect x="294" y="155" width="204" height="89" rx="13" fill="#ececec" stroke="#252525" stroke-width="1.8"/><text x="396" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#222">DEFINIR</text><text x="396" y="213" text-anchor="middle" font-size="14" fill="#4b4b4b">Usuario y necesidad</text></g><line x1="498" y1="199" x2="532" y2="199" stroke="#333" stroke-width="2"  marker-end="url(#arrow)"/><g><rect x="533" y="155" width="204" height="89" rx="13" fill="#fff" stroke="#252525" stroke-width="1.8"/><text x="635" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#222">PROPONER</text><text x="635" y="213" text-anchor="middle" font-size="14" fill="#4b4b4b">Dos alternativas</text></g><line x1="737" y1="199" x2="771" y2="199" stroke="#333" stroke-width="2"  marker-end="url(#arrow)"/><g><rect x="772" y="155" width="204" height="89" rx="13" fill="#202020" stroke="#252525" stroke-width="1.8"/><text x="874" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">VALIDAR</text><text x="874" y="213" text-anchor="middle" font-size="14" fill="#e8e8e8">Criterios medibles</text></g><text x="58" y="298" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">EJEMPLO · Acceso a una habitación</text><g><rect x="61" y="322" width="284" height="100" rx="13" fill="#fff" stroke="#252525" stroke-width="1.8"/><text x="203" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Necesidad</text><text x="203" y="380" text-anchor="middle" font-size="14" fill="#4b4b4b">Permitir el paso cómodo</text></g><g><rect x="378" y="322" width="284" height="100" rx="13" fill="#fff" stroke="#252525" stroke-width="1.8"/><text x="520" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Restricción</text><text x="520" y="380" text-anchor="middle" font-size="14" fill="#4b4b4b">Ancho disponible: 0,95 m</text></g><g><rect x="695" y="322" width="284" height="100" rx="13" fill="#fff" stroke="#252525" stroke-width="1.8"/><text x="837" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Criterio de prueba</text><text x="837" y="380" text-anchor="middle" font-size="14" fill="#4b4b4b">Apertura sin obstrucción</text></g><text x="58" y="484" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Si la propuesta no cumple el criterio, se regresa al diseño para mejorarla.</text><line x1="46" y1="524" x2="994" y2="524" stroke="#ddd"/><text x="46" y="548" fill="#202020" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start">INSTITUTO JORGE ROBLEDO  ·  INFORMÁTICA 10.º  ·  PERIODO I</text></svg>