name: TI10 · QA and regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real Chromium QA (desktop + mobile)
        run: npm run test:qa
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ti10-playwright-failures
          path: |
            playwright-report
            test-results
          retention-days: 3

  vector-and-tex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate SVG XML and accessibility labels
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("assets/diagrams/*.svg"))
          assert len(files) == 5, f"Expected 5 SVG assets, got {len(files)}"
          for file in files:
              root = ET.parse(file).getroot()
              assert root.tag == "{http://www.w3.org/2000/svg}svg", file
              assert root.get("viewBox"), file
              assert root.find("{http://www.w3.org/2000/svg}title") is not None, file
              assert root.get("role") == "img", file
              print("SVG PASS:", file)
          PY
      - name: Install TeX dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-pictures texlive-lang-spanish
      - name: Compile all 5 TikZ sources
        run: |
          mkdir -p /tmp/ijr-ti10-tex
          count=0
          for source in assets/diagrams/*.tex; do
            echo "Compiling $source"
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory /tmp/ijr-ti10-tex "$source" > /tmp/ijr-ti10-tex/compile.log 2>&1 || { cat /tmp/ijr-ti10-tex/compile.log; exit 1; }
            count=$((count+1))
          done
          test "$count" -eq 5
